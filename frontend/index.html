<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TaskFlow</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 40px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
    }

    input,
    textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      margin-bottom: 15px;
      box-sizing: border-box;
    }

    textarea {
      min-height: 120px;
    }

    button {
      padding: 12px 20px;
      border: none;
      cursor: pointer;
    }

    .success {
      margin-top: 20px;
    }

    .task {
      border-top: 1px solid #ddd;
      padding: 15px 0;
    }
  </style>
</head>

<body>

  <div class="container">

    
<h1>TaskFlow v1.1</h1>
    <h2>Créer une tâche</h2>

    <form id="task-form">

      <label>Nom</label>

      <input
        type="text"
        id="name"
        required
      >

      <label>Email</label>

      <input
        type="email"
        id="email"
        required
      >

      <label>Titre</label>

      <input
        type="text"
        id="title"
        required
      >

      <label>Description</label>

      <textarea
        id="description"
        required
      ></textarea>

      <button type="submit">
        Enregistrer la tâche
      </button>

    </form>

    <p
      id="message"
      class="success"
    ></p>

    <h2>Tâches enregistrées</h2>

    <div id="tasks"></div>

  </div>

  <script src="app.js"></script>

</body>
</html>
